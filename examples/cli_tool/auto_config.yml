mode: auto
alpha: 1.0
beta: 1.0
threshold: 0.1

base_models:
  1:
    type: "PCEModel"
    params:
      degree: 3
      poly_type: hermite
  2:
    type: "MLPModel"
    params: {}
  3:
    type: "MLPModel"
    params: {}

leaf_model:
  type: "PCEModel"
  params:
    degree: 3
    poly_type: hermite

edge_model:
  type: "MLPModel"
  params: {}

graph:
  nodes: [1, 2, 3]
  edges: [[1, 2], [2, 3]]

models:
  1:
    type: "PCEModel"
    params:
      degree: 3
      poly_type: hermite
  2:
    type: "MLPModel"
    params: {}
  3:
    type: "MLPModel"
    params: {}

training:
  learning_rate: 0.001
  num_steps: 5000

datasets:
  - name: "train_data"
    type: "training"
    data_path: "examples/cli_tool/training_data.npz"
    nodes: [1, 2, 3]

  - name: "predict_hf"
    type: "prediction"
    data_path: "examples/cli_tool/prediction_inputs.npz"
    nodes: [3]
    output_path: "results/auto_hf_predictions.npz"
