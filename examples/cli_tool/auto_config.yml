mode: auto
alpha: 1.0
beta: 1.0
threshold: 0.1

base_models:
  1:
    type: "PCEModel"
    params:
      degree: 3
      poly_type: hermite
  2:
    type: "MLPModel"
    params: {}

leaf_model:
  type: "PCEModel"
  params:
    degree: 3
    poly_type: hermite

edge_model:
  type: "MLPModel"
  params: {}

graph:
  nodes: [1, 2]
  edges: [[1, 2]]

models:
  1:
    type: "PCEModel"
    params:
      degree: 3
      poly_type: hermite
  2:
    type: "MLPModel"
    params: {}

training:
  learning_rate: 0.001
  num_steps: 5000

datasets:
  # --- Stage-2 training data --------------------------------------------
  - name: "train_data"
    type: "training"
    data_path: "examples/cli_tool/training_data.npz"
    nodes: [1, 2]

  # --- Prediction task ---------------------------------------------------
  - name: "predict_hf"
    type: "prediction"
    data_path: "examples/cli_tool/prediction_inputs.npz"   # input X
    nodes: [2]                                             # highest-fidelity node
    output_path: "results/auto_hf_predictions.npz"         # saved NPZ with y_predict
